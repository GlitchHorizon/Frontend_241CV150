<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRIS</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="gradient-bg"></div>
   <nav class="navbar">
    <div class="nav-left">
      <img src="images/logo.svg" alt="IRIS Logo" class="logo" />
    </div>

    <div class="nav-right">
      <div class="nav-item">
        <img src="images/NITK.svg" alt="Institute Icon" />
        <span>Institute</span>
        <span class="dropdown">▼</span>
      </div>
      <div class="nav-item">
        <img src="images/Hat.svg" alt="Academics Icon" />
        <span>Academics</span>
        <span class="dropdown">▼</span>
      </div>
      <div class="nav-item">
        <img src="images/Academics.svg" alt="Campus Icon" />
        <span>Campus</span>
        <span class="dropdown">▼</span>
      </div>
      <div class="nav-item">
        <img src="images/Earth.svg" alt="Alumni Icon" />
        <span>Alumni</span>
        <span class="dropdown">▼</span>
      </div>
      <div class="search-box">
        <img src="images/Search.svg" alt="Search Icon" class="search-icon" />
        <input type="text" class="search-input" placeholder="Search" />
      </div>
      <img src="images/Bell-icon.svg" alt="Notifications" class="bell-icon" />
      <img src="images/Profile.svg" alt="Profile" class="profile-icon" />
    </div>
  </nav>
  <h1 class="dashboard-heading shine" ;">Dashboard</h1>
  <main class="dashboard-content">
    <div class="dashboard-left-column">
      <section class="attendance-section">
        <span class="card-shine shine-top"></span>
        <span class="card-shine shine-bottom"></span>
        <span class="card-glow glow-top"></span>
        <card-glow class="glow-bottom"></card-glow>
        <span class="card-glow glow-bright glow-top"></span>
        <span class="card-glow glow-bright glow-bottom"></span>
        <div class="attendance-content">
          <h2>Attendance</h2>
          <div class="attendance-grid">
          </div>
        </div>
      </section>
      <section class="announcements-section">
        <span class="card-shine shine-top"></span>
        <span class="card-shine shine-bottom"></span>
        <span class="card-glow glow-top"></span>
        <card-glow class="glow-bottom"></card-glow>
        <span class="card-glow glow-bright glow-top"></span>
        <span class="card-glow glow-bright glow-bottom"></span>
        <h2>Announcements</h2>
        <div class="announcement-cards">
        </div>
      </section>
    </div>

    <section class="info-section">
      <div class="info-section-left">
        <div class="info-cards-top">
          <div class="info-card">
            <div class="info-card-front">
              <!-- <img src="images/switch.svg" alt="Switch Icon" class="switch-icon"> -->
              <img src="images/eye-off.svg" alt="Toggle Visibility" class="eye-icon">
              <span class="card-shine shine-top"></span>
              <span class="card-shine shine-bottom"></span>
              <span class="card-glow glow-top"></span>
              <span class="card-glow glow-bottom"></span>
              <span class="card-glow glow-bright glow-top"></span>
              <span class="card-glow glow-bright glow-bottom"></span>
              <img src="images/CGPA.svg" alt="CGPA Icon" class="info-icon">
              <div class="info-text">
                <span class="info-value">8</span>
                <span class="info-label">Major CGPA</span>
              </div>
            </div>
            <div class="info-card-back">
              <img src="images/switch.svg" alt="Switch Icon" class="switch-icon">
            </div>
          </div>
          <div class="info-card">
            <span class="card-shine shine-top"></span>
            <span class="card-shine shine-bottom"></span>
            <span class="card-glow glow-top"></span>
            <span class="card-glow glow-bottom"></span>
            <span class="card-glow glow-bright glow-top"></span>
            <span class="card-glow glow-bright glow-bottom"></span>
            <img src="images/Semester.svg" alt="Semester Icon" class="info-icon">
            <div class="info-text">
              <span class="info-value">3<sup>rd</sup></span>
              <span class="info-label">Semester</span>
            </div>
          </div>
        </div>
      </div>
      <div class="reminder-card">
        <span class="card-shine shine-top"></span>
        <span class="card-shine shine-bottom"></span>
        <span class="card-glow glow-top"></span>
        <span class="card-glow glow-bottom"></span>
        <span class="card-glow glow-bright glow-top"></span>
        <span class="card-glow glow-bright glow-bottom"></span>
        <h3 class="reminder-heading">Reminder</h3>
        <div class="reminder-list"></div>
        <button id="add-reminder-button">+ Add Reminder</button>
        <div class="plus-icon-container">
          <span class="plus-icon">+</span>
        </div>
      </div>
      <div class="important-links-card">
        <span class="card-shine shine-top"></span>
        <span class="card-shine shine-bottom"></span>
        <span class="card-glow glow-top"></span>
        <span class="card-glow glow-bottom"></span>
        <span class="card-glow glow-bright glow-top"></span>
        <span class="card-glow glow-bright glow-bottom"></span>
        <h3 class="important-links-heading">Important Links</h3>
        <div class="important-links-list">
          <a href="#" class="important-link-item">
            <img src="images/link.svg" alt="Link Icon" class="link-icon">
            <span>View Timetable</span>
          </a>
          <a href="#" class="important-link-item">
            <img src="images/link.svg" alt="Link Icon" class="link-icon">
            <span>Contact your professor</span>
          </a>
          <a href="#" class="important-link-item">
            <img src="images/link.svg" alt="Link Icon" class="link-icon">
            <span>Contact Advisor</span>
          </a>
          <!-- Add more links here -->
        </div>
      </div>
    </section>


  </main>

  <div id="reminder-modal" class="modal">
    <div class="modal-content">
      <span class="close-button">&times;</span>
      <h2>New Reminder</h2>
      <form id="reminder-form">
        <label for="task-name">Task Name <span class="required">*</span></label>
        <input type="text" id="task-name" required>
        <label for="task-date">Date <span class="required">*</span></label>
        <input type="date" id="task-date" required>
        <label for="task-time">Time <span class="required">*</span></label>
        <input type="time" id="task-time" required>
        <label for="task-description">Description</label>
        <textarea id="task-description"></textarea>
        <button type="submit">Save</button>
      </form>
    </div>
  </div>
  <script src="data.js"></script>
  <script src="script.js"></script>
